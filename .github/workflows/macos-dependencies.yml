name: macOS dependency sync
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.11.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - run: node scripts/sync-macos-package.cjs --check
      - run: node --test tests/macos-manifest.test.cjs
      - name: Verify desktop lockfile matches generated dependencies
        working-directory: macos
        run: bun install --frozen-lockfile --ignore-scripts
